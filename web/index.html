    const SUPABASE_HEADERS = {

    // =========================================================================

      { codigo: "080101", departamento: "CUSCO", provincia: "CUSCO", distrito: "CUSCO", agencia: "Oficina Registral RENIEC Cusco" },

    // =========================================================================

    // =========================================================================
    const USUARIOS_RBAC = {
      admin: {
        clave: "Admin123!",
        usuario: "admin",
        nombreCompleto: "Ing. Carlos Mendoza (Administrador General)",
        cargo: "Jefe de Registro Civil y Supervisión",
        sede: "Sede Central RENIEC - Lima",
        permisos: ["ROLE_ADMIN", "PADRON_LEER", "PADRON_ESCRIBIR", "PADRON_ELIMINAR", "TRAMITES_LEER", "TRAMITES_ESCRIBIR", "TRAMITES_APROBAR", "TRAMITES_ELIMINAR", "RECAUDACION_VER"]
      },
      dolton: {
        clave: "Reniec2026!",
        usuario: "dolton",
        nombreCompleto: "Brigadista Dolton Tom Meza Quispe",
        cargo: "Registrador de Brigada Itinerante",
        sede: "Brigada Móvil UPeU - Lurigancho Ñaña",
        permisos: ["ROLE_BRIGADISTA", "PADRON_LEER", "PADRON_ESCRIBIR", "TRAMITES_LEER", "TRAMITES_ESCRIBIR"]
      },
      verificador: {
        clave: "Verifica2026!",
        usuario: "verificador",
        nombreCompleto: "Lic. Ana Torres (Módulo Consulta)",
        cargo: "Verificador Biométrico AFIS y Ventanilla",
        sede: "Agencia RENIEC Ate - Vitarte",
        permisos: ["ROLE_VERIFICADOR", "PADRON_LEER", "TRAMITES_LEER"]
      }
    };

    const CIUDADANOS_INICIALES = [
      { id: 1, dni: "72345678", nombres: "DOLTON TOM", apellidoPaterno: "MEZA", apellidoMaterno: "QUISPE", fechaNacimiento: "2001-05-14", estadoCivil: "SOLTERO", ubigeo: "150118 - LIMA / LIMA / LURIGANCHO-CHOSICA", direccion: "CARRETERA CENTRAL KM 19.5 VILLA UNION - ÑAÑA", donacionOrganos: true },
      { id: 2, dni: "45896321", nombres: "MARIA ELENA", apellidoPaterno: "PAREDES", apellidoMaterno: "MENDOZA", fechaNacimiento: "1995-08-22", estadoCivil: "CASADO", ubigeo: "120114 - JUNIN / HUANCAYO / EL TAMBO", direccion: "AV. REAL 1240 URB. SAN CARLOS", donacionOrganos: true },
      { id: 3, dni: "70124589", nombres: "JORGE LUIS", apellidoPaterno: "HUAMAN", apellidoMaterno: "ROJAS", fechaNacimiento: "1998-11-03", estadoCivil: "SOLTERO", ubigeo: "211101 - PUNO / SAN ROMAN / JULIACA", direccion: "JR. MARIANO NUÑEZ 450", donacionOrganos: false },
      { id: 4, dni: "41258796", nombres: "ROSA VICTORIA", apellidoPaterno: "CASTILLO", apellidoMaterno: "VARGAS", fechaNacimiento: "1989-02-19", estadoCivil: "SOLTERO", ubigeo: "220901 - SAN MARTIN / SAN MARTIN / TARAPOTO", direccion: "JR. JIMENEZ PIMENTEL 890", donacionOrganos: true },
      { id: 5, dni: "76543210", nombres: "CARLOS ALBERTO", apellidoPaterno: "SANCHEZ", apellidoMaterno: "GAMARRA", fechaNacimiento: "2003-07-30", estadoCivil: "SOLTERO", ubigeo: "150103 - LIMA / LIMA / ATE", direccion: "AV. NICOLAS AYLLON 3420 SANTA CLARA", donacionOrganos: true }
    ];

    const TRAMITES_INICIALES = [
      { id: 1, dniCiudadano: "72345678", nombreCiudadano: "DOLTON TOM MEZA QUISPE", tipoTramite: "RENOVACION", estado: "ATENDIDO", ubigeoDestino: "150118 - LIMA / LIMA / LURIGANCHO-CHOSICA (Agencia RENIEC Ñaña)", observaciones: "Renovación a DNI Electrónico 3.0 con firma digital activa", fechaRegistro: "2026-11-01" },
      { id: 2, dniCiudadano: "45896321", nombreCiudadano: "MARIA ELENA PAREDES MENDOZA", tipoTramite: "CAMBIO_DOMICILIO", estado: "EN_PROCESO", ubigeoDestino: "120114 - JUNIN / HUANCAYO / EL TAMBO", observaciones: "Actualización de dirección domiciliaria con recibo verificado", fechaRegistro: "2026-11-02" },
      { id: 3, dniCiudadano: "70124589", nombreCiudadano: "JORGE LUIS HUAMAN ROJAS", tipoTramite: "DUPLICADO", estado: "PENDIENTE", ubigeoDestino: "211101 - PUNO / SAN ROMAN / JULIACA", observaciones: "Solicitud de duplicado por pérdida en campaña itinerante", fechaRegistro: "2026-11-03" }
    ];

    // =========================================================================
    // 4. ESTADO REACTIVO Y SINCRONIZACIÓN CON SUPABASE PostgreSQL
    // =========================================================================
    const state = {
      sesion: JSON.parse(localStorage.getItem("reniec_sesion") || "null"),
      loginUsuario: "",
      loginClave: "",
      mostrarClave: false,
      loginError: null,
      tabActual: "inicio",
      ciudadanos: JSON.parse(localStorage.getItem("reniec_ciudadanos") || JSON.stringify(CIUDADANOS_INICIALES)),
      tramites: JSON.parse(localStorage.getItem("reniec_tramites") || JSON.stringify(TRAMITES_INICIALES)),
      filtroDepartamento: "TODOS",
      filtroTexto: "",
      ciudadanoSeleccionadoId: 1,
      dniReverso: false,
      mostrarFormCiudadano: false,
      editandoCiudadanoId: null,
      formCiudadano: { dni: "", nombres: "", apellidoPaterno: "", apellidoMaterno: "", fechaNacimiento: "2000-01-15", estadoCivil: "SOLTERO", ubigeo: "150118 - LIMA / LIMA / LURIGANCHO-CHOSICA", direccion: "", donacionOrganos: true },
      filtroDepTramite: "TODOS",
      filtroEstadoTramite: "TODOS",
      filtroTextoTramite: "",
      mostrarFormTramite: false,
      editandoTramiteId: null,
      formTramite: { dniCiudadano: "", nombreCiudadano: "", tipoTramite: "RENOVACION", estado: "PENDIENTE", ubigeoDestino: "150118 - LIMA / LIMA / LURIGANCHO-CHOSICA", observaciones: "" },
      supabaseConectado: false,
      sincronizando: false
    };

    function guardarStorage() {
      localStorage.setItem("reniec_ciudadanos", JSON.stringify(state.ciudadanos));
      localStorage.setItem("reniec_tramites", JSON.stringify(state.tramites));
      if (state.sesion) {
        localStorage.setItem("reniec_sesion", JSON.stringify(state.sesion));
      } else {
        localStorage.removeItem("reniec_sesion");
      }
    }

    async function sincronizarConSupabase() {
      state.sincronizando = true;
      render();
      try {
        const [resC, resT] = await Promise.all([
          fetch(`${SUPABASE_URL}/ciudadanos?select=*&order=id.desc`, { headers: SUPABASE_HEADERS }),
          fetch(`${SUPABASE_URL}/tramites?select=*&order=id.desc`, { headers: SUPABASE_HEADERS })
        ]);
        if (resC.ok) {
          const dataC = await resC.json();
          state.ciudadanos = dataC.map(c => ({
            id: c.id,
            dni: c.dni,
            nombres: c.nombres,
            apellidoPaterno: c.apellido_paterno,
            apellidoMaterno: c.apellido_materno,
            fechaNacimiento: c.fecha_nacimiento,
            estadoCivil: c.estado_civil,
            ubigeo: c.ubigeo,
            direccion: c.direccion,
            donacionOrganos: c.donacion_organos
          }));
          if (!state.ciudadanos.some(x => x.id === state.ciudadanoSeleccionadoId)) {
            state.ciudadanoSeleccionadoId = state.ciudadanos[0]?.id || 1;
          }
        }
        if (resT.ok) {
          const dataT = await resT.json();
          state.tramites = dataT.map(t => ({
            id: t.id,
            dniCiudadano: t.dni_ciudadano,
            nombreCiudadano: t.nombre_ciudadano,
            tipoTramite: t.tipo_tramite,
            estado: t.estado,
            ubigeoDestino: t.ubigeo_destino,
            observaciones: t.observaciones,
            fechaRegistro: t.fecha_registro
          }));
        }
        state.supabaseConectado = true;
        guardarStorage();
      } catch (err) {
        state.supabaseConectado = false;
      } finally {
        state.sincronizando = false;
        render();
      }
    }

    function tienePermiso(permiso) {
      return state.sesion && state.sesion.permisos.includes(permiso);
    }

    function buscarUbigeo(texto) {
      const upper = (texto || "").toUpperCase();
      return SEDES_UBIGEO.find(s => upper.includes(s.codigo) || upper.includes(s.distrito)) ||
             SEDES_UBIGEO.find(s => upper.includes(s.departamento)) ||
             SEDES_UBIGEO[0];
    }

    function mostrarModal(titulo, mensaje) {
      const modal = document.getElementById("modal-root");
      modal.innerHTML = `
        <div class="bg-[#231033] border border-[#5d2c85] rounded-2xl max-w-md w-full p-6 shadow-2xl">
          <h3 class="text-lg font-extrabold text-[#C6FF00] mb-2">${titulo}</h3>
          <div class="text-sm text-gray-200 space-y-2">${mensaje}</div>
          <div class="mt-5 flex justify-end">
            <button onclick="cerrarModal()" class="px-5 py-2 rounded-xl bg-[#C6FF00] text-[#14071E] font-extrabold text-sm">Entendido</button>
          </div>
        </div>
      `;
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function cerrarModal() {
      const modal = document.getElementById("modal-root");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    }

    function mostrarAfis(idCiudadano) {
      const c = state.ciudadanos.find(x => x.id === idCiudadano);
      if (!c) return;
      const ub = buscarUbigeo(c.ubigeo);
      mostrarModal(
        "Verificación Biométrica AFIS • RENIEC",
        `
          <div class="p-3 rounded-xl bg-[#311747] border border-[#C6FF00]/40 flex items-center gap-3 mb-3">
            <span class="text-2xl">🧬</span>
            <div>
              <div class="text-[#C6FF00] font-extrabold text-xs">IDENTIDAD VERIFICADA (99.8% Match)</div>
              <div class="text-xs text-gray-300">Dedo Índice Derecho • Minucias: 42/42</div>
            </div>
          </div>
          <p><b>Ciudadano:</b> ${c.nombres} ${c.apellidoPaterno} ${c.apellidoMaterno}</p>
          <p><b>DNI / CUI:</b> ${c.dni}</p>
          <p><b>Ubigeo INEI:</b> ${ub.codigo} - ${ub.departamento} / ${ub.provincia} / ${ub.distrito}</p>
          <p><b>Sede Registral:</b> ${ub.agencia}</p>
          <p class="text-[#40C4FF] font-bold">Estado Padrón: HÁBIL SIN RESTRICCIONES</p>
        `
      );
    }

    // =========================================================================
    // 5. ACCIONES CRUD SINCRONIZADAS CON SUPABASE
    // =========================================================================
    function ejecutarLogin(e) {
      if (e) e.preventDefault();
      const u = state.loginUsuario.trim().toLowerCase();
      const p = state.loginClave;
      const cuenta = USUARIOS_RBAC[u];
      if (!cuenta || cuenta.clave !== p) {
        state.loginError = "Credenciales inválidas. Verifique su usuario y contraseña institucional.";
        render();
        return;
      }
      state.sesion = cuenta;
      state.loginError = null;
      state.loginUsuario = "";
      state.loginClave = "";
      guardarStorage();
      sincronizarConSupabase();
    }

    function cerrarSesion() {
      state.sesion = null;
      state.tabActual = "inicio";
      guardarStorage();
      render();
    }

    async function guardarCiudadano(e) {
      e.preventDefault();
      const f = state.formCiudadano;
      if (!/^\d{8}$/.test(f.dni.trim())) {
        mostrarModal("Validación de Padrón", "El número de DNI debe tener exactamente 8 dígitos numéricos.");
        return;
      }
      if (!f.nombres.trim() || !f.apellidoPaterno.trim() || !f.direccion.trim()) {
        mostrarModal("Validación de Padrón", "Complete los nombres, apellidos y dirección domiciliaria.");
        return;
      }
      const payload = {
        dni: f.dni.trim(),
        nombres: f.nombres.trim(),
        apellido_paterno: f.apellidoPaterno.trim(),
        apellido_materno: f.apellidoMaterno.trim(),
        fecha_nacimiento: f.fechaNacimiento,
        estado_civil: f.estadoCivil,
        ubigeo: f.ubigeo,
        direccion: f.direccion.trim(),
        donacion_organos: !!f.donacionOrganos
      };
      try {
        if (state.editandoCiudadanoId) {
          await fetch(`${SUPABASE_URL}/ciudadanos?id=eq.${state.editandoCiudadanoId}`, {
            method: "PATCH",
            headers: SUPABASE_HEADERS,
            body: JSON.stringify(payload)
          });
        } else {
          await fetch(`${SUPABASE_URL}/ciudadanos`, {
            method: "POST",
            headers: SUPABASE_HEADERS,
            body: JSON.stringify(payload)
          });
        }
        state.mostrarFormCiudadano = false;
        state.editandoCiudadanoId = null;
        await sincronizarConSupabase();
      } catch (err) {
        mostrarModal("Error de Red", "No se pudo sincronizar con Supabase.");
      }
    }

    async function eliminarCiudadano(id) {
      if (!tienePermiso("PADRON_ELIMINAR")) return;
      try {
        await fetch(`${SUPABASE_URL}/ciudadanos?id=eq.${id}`, {
          method: "DELETE",
          headers: SUPABASE_HEADERS
        });
        await sincronizarConSupabase();
      } catch (err) {}
    }

    function iniciarTramiteDesdeCiudadano(idCiudadano) {
      const c = state.ciudadanos.find(x => x.id === idCiudadano);
      if (!c) return;
      state.formTramite = {
        dniCiudadano: c.dni,
        nombreCiudadano: `${c.nombres} ${c.apellidoPaterno} ${c.apellidoMaterno}`,
        tipoTramite: "RENOVACION",
        estado: "PENDIENTE",
        ubigeoDestino: c.ubigeo,
        observaciones: "Trámite generado desde consulta de Padrón DNIe 3.0"
      };
      state.editandoTramiteId = null;
      state.mostrarFormTramite = true;
      state.tabActual = "tramites";
      render();
    }

    async function guardarTramite(e) {
      e.preventDefault();
      const f = state.formTramite;
      if (!/^\d{8}$/.test(f.dniCiudadano.trim()) || !f.nombreCiudadano.trim()) {
        mostrarModal("Validación de Trámite", "Ingrese un DNI válido de 8 dígitos y el nombre del ciudadano.");
        return;
      }
      const hoy = new Date().toISOString().slice(0, 10);
      const payload = {
        dni_ciudadano: f.dniCiudadano.trim(),
        nombre_ciudadano: f.nombreCiudadano.trim(),
        tipo_tramite: f.tipoTramite,
        estado: f.estado,
        ubigeo_destino: f.ubigeoDestino,
        observaciones: f.observaciones.trim(),
        fecha_registro: hoy
      };
      try {
        if (state.editandoTramiteId) {
          await fetch(`${SUPABASE_URL}/tramites?id=eq.${state.editandoTramiteId}`, {
            method: "PATCH",
            headers: SUPABASE_HEADERS,
            body: JSON.stringify(payload)
          });
        } else {
          await fetch(`${SUPABASE_URL}/tramites`, {
            method: "POST",
            headers: SUPABASE_HEADERS,
            body: JSON.stringify(payload)
          });
        }
        state.mostrarFormTramite = false;
        state.editandoTramiteId = null;
        await sincronizarConSupabase();
      } catch (err) {}
    }

    async function aprobarTramite(id) {
      if (!tienePermiso("TRAMITES_APROBAR")) return;
      try {
        await fetch(`${SUPABASE_URL}/tramites?id=eq.${id}`, {
          method: "PATCH",
          headers: SUPABASE_HEADERS,
          body: JSON.stringify({ estado: "ATENDIDO" })
        });
        await sincronizarConSupabase();
      } catch (err) {}
    }

    async function eliminarTramite(id) {
      if (!tienePermiso("TRAMITES_ELIMINAR")) return;
      try {
        await fetch(`${SUPABASE_URL}/tramites?id=eq.${id}`, {
          method: "DELETE",
          headers: SUPABASE_HEADERS
        });
        await sincronizarConSupabase();
      } catch (err) {}
    }

    // =========================================================================
    // 6. VISTAS (LOGIN + DASHBOARD + PADRÓN + TRÁMITES + PERFIL)
    // =========================================================================
    function renderLogin() {
      return `
        <div class="flex-1 login-gradient relative flex flex-col items-center justify-between overflow-hidden min-h-screen sm:min-h-[860px]">
          <div class="absolute inset-0 bg-[#1A0926] stori-peak pointer-events-none"></div>

          <div class="relative z-10 pt-12 pb-6 px-6 flex items-center justify-center gap-5 w-full">
            <div class="w-12 h-12 rotate-45 border-2 border-white rounded-xl p-1.5 flex items-center justify-center shadow-lg">
              <div class="w-full h-full border border-[#C6FF00] rounded-md flex items-center justify-center">
                <span class="-rotate-45 text-white text-lg">🪪</span>
              </div>
            </div>
            <div>
              <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">Reniec Móvil</h1>
              <p class="text-xs sm:text-sm text-white/85 font-medium">Red Nacional de Identificación</p>
            </div>
          </div>

          <form onsubmit="ejecutarLogin(event)" class="relative z-10 w-full max-w-sm px-8 pb-12 pt-16 flex flex-col flex-1 justify-center">

            <div class="mb-6">
              <label class="block text-xs font-bold text-white mb-1">Usuario</label>
              <input

    function renderTramites() {

              <h2 class="text-base sm:text-lg font-extrabold">Gestión de Trámites por Ubigeo • Supabase Cloud</h2>
              <p class="text-xs text-[#C6FF00]">
                ${puedeEliminar ? 'Rol Admin: Crear, Editar, Aprobar/Atender y Eliminar habilitados' : puedeEscribir ? 'Rol Brigadista: Creación y edición Offline-First habilitadas' : 'Módulo Consulta: Visualización de etapas del trámite por Sede'}
              </p>
            </div>
            ${puedeEscribir ? `
              <button onclick="state.mostrarFormTramite = !state.mostrarFormTramite; state.editandoTramiteId = null; render();" class="px-4 py-2 rounded-xl bg-[#C6FF00] text-[#14071E] font-extrabold text-xs">
                + Nuevo Trámite
              </button>
            ` : ''}
          </div>

          <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
            ${DEPARTAMENTOS.map(dep => `
              <button
                onclick="state.filtroDepTramite = '${dep}'; render();"
                class="px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap ${state.filtroDepTramite === dep ? 'bg-[#C6FF00] text-[#14071E]' : 'bg-[#231033] text-[#C9B6D9] border border-[#3d1e57]'}"
              >
                ${dep === 'TODOS' ? 'TODAS LAS SEDES' : dep}
              </button>
            `).join('')}
          </div>

          <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
            ${["TODOS", ...ESTADOS_TRAMITE].map(est => `
              <button
                onclick="state.filtroEstadoTramite = '${est}'; render();"
                class="px-3 py-1 rounded-lg text-[11px] font-bold whitespace-nowrap ${state.filtroEstadoTramite === est ? 'bg-[#40C4FF] text-[#00263A]' : 'bg-[#311747] text-[#C9B6D9]'}"
              >
                ${est}
              </button>
            `).join('')}
          </div>

          ${state.mostrarFormTramite && puedeEscribir ? `
            <form onsubmit="guardarTramite(event)" class="p-4 rounded-2xl bg-[#231033] border border-[#C6FF00]/50 space-y-3">
              <h3 class="text-sm font-extrabold text-[#C6FF00]">${state.editandoTramiteId ? 'Actualizar Trámite DNI en Supabase' : 'Registrar Solicitud de Trámite DNI en Supabase'}</h3>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                <input type="text" maxlength="8" placeholder="DNI del Ciudadano (8 dígitos)" value="${state.formTramite.dniCiudadano}" oninput="state.formTramite.dniCiudadano = this.value" class="px-3 py-2 rounded-xl bg-[#160821] border border-[#3d1e57] text-xs" required />
                <input type="text" placeholder="Apellidos y Nombres" value="${state.formTramite.nombreCiudadano}" oninput="state.formTramite.nombreCiudadano = this.value.toUpperCase()" class="px-3 py-2 rounded-xl bg-[#160821] border border-[#3d1e57] text-xs" required />
              </div>
              <div class="flex gap-1.5 overflow-x-auto no-scrollbar">
                ${TIPOS_TRAMITE.map(t => `
                  <button type="button" onclick="state.formTramite.tipoTramite = '${t.id}'; render();" class="px-2.5 py-1 rounded-lg text-[11px] font-bold whitespace-nowrap ${state.formTramite.tipoTramite === t.id ? 'bg-[#C6FF00] text-[#14071E]' : 'bg-[#311747] text-white'}">
                    ${t.etiqueta} (S/ ${t.costo})
                  </button>
                `).join('')}
              </div>
              <div class="flex gap-1.5 overflow-x-auto no-scrollbar">
                ${SEDES_UBIGEO.map(sede => `
                  <button type="button" onclick="state.formTramite.ubigeoDestino = '${sede.codigo} - ${sede.departamento} / ${sede.provincia} / ${sede.distrito} (${sede.agencia})'; render();" class="px-2.5 py-1 rounded-lg text-[11px] font-bold whitespace-nowrap ${state.formTramite.ubigeoDestino.includes(sede.codigo) ? 'bg-[#40C4FF] text-[#00263A]' : 'bg-[#311747] text-white'}">
                    ${sede.departamento} • ${sede.distrito}
                  </button>
                `).join('')}
              </div>
              <input type="text" placeholder="Sustento / Observaciones" value="${state.formTramite.observaciones}" oninput="state.formTramite.observaciones = this.value" class="w-full px-3 py-2 rounded-xl bg-[#160821] border border-[#3d1e57] text-xs" required />
              <div class="flex gap-2">
                <button type="submit" class="flex-1 py-2 rounded-xl bg-[#C6FF00] text-[#14071E] font-extrabold text-xs">Guardar en Supabase Cloud</button>
                <button type="button" onclick="state.mostrarFormTramite = false; render();" class="flex-1 py-2 rounded-xl border border-[#C9B6D9]/40 text-xs font-bold">Cancelar</button>
              </div>
            </form>
          ` : ''}

          <div class="space-y-3">
            ${filtrados.map(t => {
              const tipo = TIPOS_TRAMITE.find(x => x.id === t.tipoTramite) || TIPOS_TRAMITE[1];
              const ub = buscarUbigeo(t.ubigeoDestino);
              const nivel = t.estado === "ATENDIDO" ? 3 : (t.estado === "EN_PROCESO" || t.estado === "OBSERVADO") ? 2 : 1;
              return `
                <div class="p-4 rounded-2xl bg-[#231033] border border-[#3d1e57] space-y-2.5">
                  <div class="flex justify-between items-center">
                    <div class="text-sm font-extrabold">DNI ${t.dniCiudadano} • ${t.nombreCiudadano}</div>
                    <span class="px-2.5 py-0.5 rounded-lg bg-[#2E1647] text-[#C6FF00] text-[11px] font-bold">⚡ Supabase Cloud</span>
                  </div>
                  <div class="text-xs text-[#C6FF00] font-semibold">
                    Tipo: ${tipo.etiqueta} (Tasa S/ ${tipo.costo}.00) | Estado: ${t.estado}
                  </div>
                  <div class="grid grid-cols-3 gap-1.5 text-center text-[11px] font-bold">
                    <div class="py-1 rounded-md ${nivel >= 1 ? 'bg-[#C6FF00] text-[#14071E]' : 'bg-[#311747] text-gray-400'}">1. Recibido</div>
                    <div class="py-1 rounded-md ${nivel >= 2 ? 'bg-[#C6FF00] text-[#14071E]' : 'bg-[#311747] text-gray-400'}">2. Procesando</div>
                    <div class="py-1 rounded-md ${nivel >= 3 ? 'bg-[#C6FF00] text-[#14071E]' : 'bg-[#311747] text-gray-400'}">3. Entregado</div>
                  </div>
                  <div class="text-xs font-semibold">Ubigeo (${ub.codigo}): ${t.ubigeoDestino} | Fecha: ${t.fechaRegistro}</div>
                  <div class="text-xs text-[#C9B6D9]">Observación: ${t.observaciones}</div>
                  <div class="flex justify-end gap-2 pt-1">
                    ${puedeAprobar && t.estado !== "ATENDIDO" ? `<button onclick="aprobarTramite(${t.id})" class="px-3 py-1 rounded-lg bg-[#40C4FF] text-[#00263A] font-extrabold text-xs">✓ Aprobar Entrega</button>` : ''}
                    ${puedeEliminar ? `<button onclick="eliminarTramite(${t.id})" class="px-3 py-1 rounded-lg bg-[#5C1127] text-[#FFCDD2] font-bold text-xs">🗑️ Anular</button>` : ''}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderPerfil() {
      const s = state.sesion;
      return `
        <div class="space-y-4">
          <div class="p-5 rounded-2xl bg-[#231033] border border-[#3d1e57] space-y-2.5">
            <h3 class="text-base font-extrabold text-[#C6FF00]">🛡️ Credencial Digital del Registrador (JWT)</h3>
            <hr class="border-[#3d1e57]" />
            <p class="text-sm font-bold">Operador: ${s.nombreCompleto}</p>
            <p class="text-xs text-[#C9B6D9]">Usuario: @${s.usuario}</p>
            <p class="text-xs text-[#C9B6D9]">Cargo: ${s.cargo}</p>
            <p class="text-xs text-[#C9B6D9]">Sede asignada: ${s.sede}</p>
            <div class="p-3 rounded-xl bg-[#4B125E] text-xs font-bold text-[#C6FF00]">
              Permisos JWT: ${s.permisos.join(", ")}
            </div>
          </div>

          <div class="p-5 rounded-2xl bg-[#231033] border border-[#3d1e57] space-y-2">
            <h3 class="text-base font-extrabold text-[#40C4FF]">☁️ Arquitectura Híbrida Supabase + Cloudflare + Android KMP</h3>
            <p class="text-xs text-[#C9B6D9]">• Endpoint Supabase: <span class="mono text-[#C6FF00]">vktclzpkebwvfbrvtpxo.supabase.co</span></p>
            <p class="text-xs text-[#C9B6D9]">• Plataforma Web: Cloudflare Pages Edge CDN</p>
            <p class="text-xs text-[#C9B6D9]">• App Móvil: Kotlin Multiplatform + Compose Multiplatform + SQLDelight Offline</p>
            <p class="text-xs text-[#C6FF00] font-bold">• Sincronización bidireccional en vivo entre tu celular y la web</p>
          </div>

          <button onclick="cerrarSesion()" class="w-full py-3.5 rounded-xl bg-[#FF5252] text-white font-extrabold text-sm shadow-lg">
            🚪 Cerrar Sesión Segura (Borrar JWT)
          </button>
        </div>
      `;
    }

    function renderMainScaffold() {
      const s = state.sesion;
      const titulos = { inicio: "Inicio", padron: "Padrón DNI", tramites: "Trámites", perfil: "Perfil" };
      return `
        <header class="topbar-gradient px-5 py-3.5 flex items-center justify-between shadow-md">
          <div class="flex items-center gap-3">
            <div class="w-7 h-7 rotate-45 border-2 border-[#C6FF00] rounded-md flex items-center justify-center">
              <span class="-rotate-45 text-xs">🪪</span>
            </div>
            <span class="font-extrabold text-sm sm:text-base tracking-wide text-white">
              ${titulos[state.tabActual]} • ${s.usuario.toUpperCase()}
            </span>
          </div>
          <button onclick="cerrarSesion()" class="text-xs font-bold px-3 py-1.5 rounded-lg bg-black/25 text-[#C6FF00] hover:bg-black/40">
            Salir
          </button>
        </header>

        <main class="flex-1 p-4 sm:p-6 overflow-y-auto">
          ${state.tabActual === "inicio" ? renderInicio() : ""}
          ${state.tabActual === "padron" ? renderPadron() : ""}
          ${state.tabActual === "tramites" ? renderTramites() : ""}
          ${state.tabActual === "perfil" ? renderPerfil() : ""}
        </main>

        <nav class="bg-[#231033] border-t border-[#3d1e57] px-3 py-2 grid grid-cols-4 gap-2">
          ${[
            { id: "inicio", label: "Inicio", icon: "🏠" },
            { id: "padron", label: "Padrón DNI", icon: "🪪" },
            { id: "tramites", label: "Trámites", icon: "📋" },
            { id: "perfil", label: "Perfil", icon: "👤" }
          ].map(item => `
            <button
              onclick="state.tabActual = '${item.id}'; render();"
              class="flex flex-col items-center justify-center py-1.5 rounded-xl transition ${state.tabActual === item.id ? 'bg-[#C6FF00] text-[#14071E] font-extrabold' : 'text-[#C9B6D9] hover:text-white font-semibold'}"
            >
              <span class="text-base">${item.icon}</span>
              <span class="text-[11px] mt-0.5">${item.label}</span>
            </button>
          `).join('')}
        </nav>
      `;
    }

    function render() {
      const root = document.getElementById("app-root");
      root.innerHTML = state.sesion ? renderMainScaffold() : renderLogin();
    }

    render();
    sincronizarConSupabase();
  </script>
</body>
</html>
