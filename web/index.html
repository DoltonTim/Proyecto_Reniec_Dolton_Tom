    function urlFotoCiudadano(dni) {
      if (!dni) return "";
      const v = state.fotoCacheBuster[dni] || "1";

    }

    function archivoAJpegBlob(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const objUrl = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(objUrl);
          const maxDim = 720;
          let w = img.width || 480;
          let h = img.height || 480;
          if (w > maxDim || h > maxDim) {
            const escala = maxDim / Math.max(w, h);
            w = Math.round(w * escala);
            h = Math.round(h * escala);
          }
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          canvas.toBlob(blob => {
            if (blob) resolve(blob);
            else reject(new Error("No se pudo convertir la foto a JPEG"));
          }, "image/jpeg", 0.88);
        };
        img.onerror = () => {
          URL.revokeObjectURL(objUrl);
          reject(new Error("Archivo de imagen inválido"));
        };
        img.src = objUrl;
      });
    }

    async function subirFotoCiudadano(dni, file) {
      const dniLimpio = (dni || "").trim();
      if (!/^\d{8}$/.test(dniLimpio) || !file) return false;
      state.subiendoFotoDni = dniLimpio;
      render();
      try {
        const jpegBlob = await archivoAJpegBlob(file);
        const res = await fetch(`${SUPABASE_STORAGE_URL}/${BUCKET_FOTOS}/${dniLimpio}.jpg`, {
          method: "POST",
          headers: {
            "apikey": SUPABASE_KEY,
            "x-upsert": "true",
            "Content-Type": "image/jpeg"
          },
          body: jpegBlob
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        state.fotoCacheBuster[dniLimpio] = Date.now();
        await registrarAuditoria("CAPTURA_BIOMETRICA_WEB", "BIOMETRIA", dniLimpio, `Foto biométrica subida a Supabase Storage (${BUCKET_FOTOS}/${dniLimpio}.jpg)`);
        await sincronizarConSupabase();
        return true;
      } catch (err) {
        mostrarModal("Error al subir fotografía", "No se pudo subir la imagen a Supabase Storage (" + (err.message || "red") + ").");
        return false;
      } finally {
        state.subiendoFotoDni = null;
        render();
      }
    }

    async function registrarAuditoria(accion, entidad, referenciaDni, detalle) {
      if (!state.sesion) return;
      const rol = state.sesion.permisos.find(p => p.startsWith("ROLE_")) || "ROLE_ADMIN";
      try {
        await fetch(`${SUPABASE_URL}/auditoria_reniec`, {
          method: "POST",
          headers: SUPABASE_HEADERS,
          body: JSON.stringify({
            usuario: state.sesion.usuario,
            rol,
            accion,
            entidad,
            referencia_dni: referenciaDni || "SISTEMA",
            detalle,
            canal_telemetria: "Cloudflare Pages Web",
            dispositivo: navigator.userAgent.slice(0, 48)
          })
        });
      } catch (_) {}
    }

    async function sincronizarConSupabase() {
      state.sincronizando = true;
      render();
      try {
        const [resC, resCount, resT, resA, resO] = await Promise.all([
          fetch(`${SUPABASE_URL}/ciudadanos?select=*&order=id.desc&limit=80`, { headers: SUPABASE_HEADERS }),
          fetch(`${SUPABASE_URL}/ciudadanos?select=id`, { headers: { ...SUPABASE_HEADERS, "Prefer": "count=exact", "Range": "0-0" } }),
          fetch(`${SUPABASE_URL}/tramites?select=*&order=id.desc`, { headers: SUPABASE_HEADERS }),
          fetch(`${SUPABASE_URL}/auditoria_reniec?select=*&order=id.desc&limit=200`, { headers: SUPABASE_HEADERS }),
          fetch(`${SUPABASE_URL}/operadores_reniec?select=*&order=id.desc`, { headers: SUPABASE_HEADERS })
        ]);
        if (resC.ok) {
          const dataC = await resC.json();
          state.ciudadanos = dataC.map(c => ({
            id: c.id,
            dni: c.dni,
            nombres: c.nombres,
            apellidoPaterno: c.apellido_paterno,
            apellidoMaterno: c.apellido_materno,
            fechaNacimiento: c.fecha_nacimiento,
            estadoCivil: c.estado_civil,
            ubigeo: c.ubigeo,
            direccion: c.direccion,
            donacionOrganos: c.donacion_organos
          }));
          if (!state.ciudadanos.some(x => x.id === state.ciudadanoSeleccionadoId)) {
            state.ciudadanoSeleccionadoId = state.ciudadanos[0]?.id || 1;
          }
        }
        if (resCount.ok) {
          const cr = resCount.headers.get("content-range") || "";
          const totalMatch = cr.match(/\/(\d+)$/);
          if (totalMatch) state.totalCiudadanos = parseInt(totalMatch[1], 10);
        }
        if (resT.ok) {
          const dataT = await resT.json();
          state.tramites = dataT.map(t => ({
            id: t.id,
            dniCiudadano: t.dni_ciudadano,
            nombreCiudadano: t.nombre_ciudadano,
            tipoTramite: t.tipo_tramite,
            estado: t.estado,
            ubigeoDestino: t.ubigeo_destino,
            observaciones: t.observaciones,
            fechaRegistro: t.fecha_registro
          }));
        }
        if (resA.ok) {
          state.auditorias = await resA.json();
        }
        if (resO.ok) {
          state.operadores = await resO.json();
        }
        state.supabaseConectado = true;
        guardarStorage();
      } catch (err) {
        state.supabaseConectado = false;
      } finally {
        state.sincronizando = false;
        render();
      }
    }

    async function enviarEnlaceGoogle() {
      const user = (document.getElementById("google-recovery-user")?.value || "").trim().toLowerCase().split("@")[0];
      const email = (document.getElementById("google-recovery-email")?.value || "").trim().toLowerCase();
      const phone = normalizarTel(document.getElementById("google-recovery-phone")?.value || "");
      const msg = document.getElementById("google-recovery-msg");
      const otpBox = document.getElementById("google-otp-box");
      const btn = document.getElementById("btn-send-google");
      msg.classList.remove("hidden");
      if (!user || !email.includes("@") || phone.length < 6) {
        msg.textContent = "Completa tu usuario, correo registrado y teléfono celular (9 dígitos).";
        return;
      }
      if (btn) btn.textContent = "Validando...";
      try {
        const resOp = await fetch(`${SUPABASE_URL}/operadores_reniec?username=eq.${encodeURIComponent(user)}&select=*&limit=1`, { headers: SUPABASE_HEADERS });
        const ops = resOp.ok ? await resOp.json() : [];
        const op = ops[0];
        if (!op) {
          msg.textContent = `El usuario @${user} no existe en Supabase.`;
          if (btn) btn.textContent = "Validar y Enviar Código";
          return;
        }
        if (op.activo === false) {
          msg.textContent = `La cuenta @${user} está cesada o inactiva. Contacta al Administrador.`;
          if (btn) btn.textContent = "Validar y Enviar Código";
          return;
        }
        const correoEsperado = (op.email || "").trim().toLowerCase() || ((user === "admin" || user === "dolton") ? "doltontomsistemas@gmail.com" : "");
        const telEsperado = normalizarTel(op.telefono) || ((user === "admin" || user === "dolton") ? "930703759" : "");
        if (!correoEsperado || !telEsperado) {
          msg.textContent = `El operador @${user} no tiene correo o teléfono configurado. Solicita al Administrador registrarlo.`;
          if (btn) btn.textContent = "Validar y Enviar Código";
          return;
        }
        if (email !== correoEsperado || phone !== telEsperado) {
          msg.textContent = `Validación doble fallida: el correo o teléfono no coincide con el registrado para @${user}.`;
          if (btn) btn.textContent = "Validar y Enviar Código";
          return;
        }

        if (btn) btn.textContent = "Enviando a Gmail...";
        const res = await fetch(`${SUPABASE_AUTH_URL}/otp`, {
          method: "POST",
          headers: {
            "apikey": SUPABASE_KEY,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email: email,
            create_user: true,
            options: { emailRedirectTo: window.location.origin }
          })
        });
        if (res.ok) {
          msg.textContent = "✓ Identidad validada. Código de 6 dígitos enviado a " + email + ". Revisa tu Gmail (o Spam) e ingrésalo abajo.";
          if (otpBox) otpBox.classList.remove("hidden");
          if (btn) btn.textContent = "Reenviar Código";
        } else {
          const errData = await res.json().catch(() => ({}));
          msg.textContent = "Aviso de Supabase Auth: " + (errData.msg || errData.error_description || "Ya se envió un correo recientemente. Espera 60 segundos.");
          if (otpBox) otpBox.classList.remove("hidden");
          if (btn) btn.textContent = "Reintentar";
        }
      } catch (e) {
        msg.textContent = "Error de conexión al validar identidad con Supabase.";
        if (btn) btn.textContent = "Validar y Enviar Código";
      }
    }

    async function verificarCodigoGoogle() {
      const user = (document.getElementById("google-recovery-user")?.value || "").trim().toLowerCase().split("@")[0];
      const email = (document.getElementById("google-recovery-email")?.value || "").trim().toLowerCase();
      const token = (document.getElementById("google-otp-code")?.value || "").trim();
      const nuevaClave = (document.getElementById("google-new-pass")?.value || "").trim();
      const msg = document.getElementById("google-recovery-msg");
      if (!token || token.length < 6) {
        msg.classList.remove("hidden");
        msg.textContent = "Ingresa el código numérico de 6 dígitos enviado a tu Gmail.";
        return;
      }
      if (nuevaClave.length < 6) {
        msg.classList.remove("hidden");
        msg.textContent = "Ingresa una nueva contraseña de al menos 6 caracteres.";
        return;
      }
      try {
        let res = await fetch(`${SUPABASE_AUTH_URL}/verify`, {
          method: "POST",
          headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
          body: JSON.stringify({ email: email, token: token, type: "email" })
        });
        if (!res.ok) {
          res = await fetch(`${SUPABASE_AUTH_URL}/verify`, {
            method: "POST",
            headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
            body: JSON.stringify({ email: email, token: token, type: "magiclink" })
          });
        }
        if (res.ok) {
          await fetch(`${SUPABASE_URL}/operadores_reniec?username=eq.${encodeURIComponent(user)}`, {
            method: "PATCH",
            headers: SUPABASE_HEADERS,
            body: JSON.stringify({ password: nuevaClave })
          });
          const resOp = await fetch(`${SUPABASE_URL}/operadores_reniec?username=eq.${encodeURIComponent(user)}&select=*&limit=1`, { headers: SUPABASE_HEADERS });
          const ops = resOp.ok ? await resOp.json() : [];
          const op = ops[0];
          state.sesion = op ? {
            usuario: op.username,
            nombreCompleto: op.nombre_completo,
            cargo: op.cargo,
            sede: op.sede,
            permisos: (op.permisos || "ROLE_VERIFICADOR,PADRON_LEER,TRAMITES_LEER").split(",").map(x => x.trim()).filter(Boolean)
          } : { ...USUARIOS_RBAC.dolton, usuario: user };
          guardarStorage();
          await registrarAuditoria("RECUPERACION_CLAVE_2FA", "SEGURIDAD", user, `Restablecimiento de clave con validación doble (Teléfono + OTP Gmail ${email})`);
          cerrarModal();
          await sincronizarConSupabase();
        } else {
          msg.classList.remove("hidden");
          msg.textContent = "El código ingresado es incorrecto o ha expirado.";
        }
      } catch (e) {
        msg.classList.remove("hidden");
        msg.textContent = "No se pudo verificar el código con Supabase Auth.";
      }
    }

    async function ejecutarLogin(e) {
      if (e) e.preventDefault();
      const u = state.loginUsuario.trim().toLowerCase().split("@")[0];
      const p = state.loginClave.trim();

      // 1. Verificar contra lista de operadores_reniec en Supabase
      if (state.operadores.length === 0) {
        try {
          const resOp = await fetch(`${SUPABASE_URL}/operadores_reniec?select=*`, { headers: SUPABASE_HEADERS });
          if (resOp.ok) state.operadores = await resOp.json();
        } catch (_) {}
      }
      const opRemoto = state.operadores.find(o => (o.username || "").toLowerCase() === u && o.activo !== false);
      let cuenta = null;
      if (opRemoto && (opRemoto.password === p || opRemoto.password.toLowerCase() === p.toLowerCase())) {
        cuenta = {
          usuario: opRemoto.username,
          nombreCompleto: opRemoto.nombre_completo,
          cargo: opRemoto.cargo,
          sede: opRemoto.sede,
          permisos: (opRemoto.permisos || "ROLE_VERIFICADOR,PADRON_LEER,TRAMITES_LEER").split(",").map(x => x.trim()).filter(Boolean)
        };
      } else {
        const cuentaLocal = USUARIOS_RBAC[u];
        if (cuentaLocal && (cuentaLocal.clave.toLowerCase() === p.toLowerCase() || cuentaLocal.clave.replace("!", "").toLowerCase() === p.toLowerCase())) {
          cuenta = cuentaLocal;
        }
      }

      if (!cuenta) {
        state.loginError = "Credenciales inválidas o cuenta cesada. Verifique su usuario y contraseña institucional.";
        render();
        return;
      }
      state.sesion = cuenta;
      state.loginError = null;
      state.loginUsuario = "";
      state.loginClave = "";
      guardarStorage();
      await sincronizarConSupabase();
      registrarAuditoria("LOGIN_WEB", "SESION", cuenta.usuario.toUpperCase(), `Inicio de sesión en Cloudflare Pages como ${cuenta.cargo}`);
    }

        apellido_paterno: f.apellidoPaterno.trim(),
        apellido_materno: f.apellidoMaterno.trim(),

        estado_civil: f.estadoCivil,
        ubigeo: f.ubigeo,
        direccion: f.direccion.trim(),

            method: "PATCH",
            headers: SUPABASE_HEADERS,

          await registrarAuditoria("ACTUALIZAR_PADRON", "CIUDADANO", dniLimpio, `Actualizó datos de ${payload.nombres} ${payload.apellido_paterno}`);
        } else {

            method: "POST",
            headers: SUPABASE_HEADERS,
            body: JSON.stringify(payload)
          });
          await registrarAuditoria("EMPADRONAR_CIUDADANO", "CIUDADANO", dniLimpio, `Empadronó a ${payload.nombres} ${payload.apellido_paterno}`);

    function renderTramitesResultados() {
      const puedeAprobar = tienePermiso("TRAMITES_APROBAR");

      const filtrados = state.tramites.filter(t => {
        const ub = buscarUbigeo(t.ubigeoDestino);
        const okDep = state.filtroDepTramite === "TODOS" || ub.departamento === state.filtroDepTramite || t.ubigeoDestino.toUpperCase().includes(state.filtroDepTramite);
        const okEst = state.filtroEstadoTramite === "TODOS" || t.estado === state.filtroEstadoTramite;
        const q = state.filtroTextoTramite.trim().toLowerCase();
        const okTxt = !q || t.dniCiudadano.includes(q) || t.nombreCiudadano.toLowerCase().includes(q) || t.ubigeoDestino.toLowerCase().includes(q);
        return okDep && okEst && okTxt;
      });

      return filtrados.map(t => {
        const tipo = TIPOS_TRAMITE.find(x => x.id === t.tipoTramite) || TIPOS_TRAMITE[1];
        const ub = buscarUbigeo(t.ubigeoDestino);
        const nivel = t.estado === "ATENDIDO" ? 3 : (t.estado === "EN_PROCESO" || t.estado === "OBSERVADO") ? 2 : 1;

            <div class="flex justify-between items-center">
              <div class="text-sm font-extrabold">DNI ${t.dniCiudadano} • ${t.nombreCiudadano}</div>
              <span class="px-2.5 py-0.5 rounded-lg bg-[#2E1647] text-[#C6FF00] text-[11px] font-bold">⚡ Supabase Cloud</span>
            </div>
            <div class="text-xs text-[#C6FF00] font-semibold">
              Tipo: ${tipo.etiqueta} (Tasa S/ ${tipo.costo}.00) | Estado: ${t.estado}
            </div>
            <div class="grid grid-cols-3 gap-1.5 text-center text-[11px] font-bold">
              <div class="py-1 rounded-md ${nivel >= 1 ? 'bg-[#C6FF00] text-[#14071E]' : 'bg-[#311747] text-gray-400'}">1. Recibido</div>
              <div class="py-1 rounded-md ${nivel >= 2 ? 'bg-[#C6FF00] text-[#14071E]' : 'bg-[#311747] text-gray-400'}">2. Procesando</div>

    function renderDonutChartSvg(titulo, mapaConteos) {
      const colores = ["#F05922", "#00B4D8", "#10B981", "#F59E0B", "#EC4899", "#8B5CF6", "#3B82F6", "#14B8A6"];
      const entradas = Object.entries(mapaConteos).sort((a, b) => b[1] - a[1]);
      const total = entradas.reduce((acc, [, v]) => acc + v, 0);
      if (total === 0) {
        return `
          <div class="p-4 rounded-2xl bg-[#231033] border border-[#3d1e57] text-center text-xs text-[#C9B6D9]">
            Sin datos registrados para "${titulo}".
          </div>
        `;
      }
      const r = 46;
      const circ = 2 * Math.PI * r;
      let offsetAcum = 0;
      const segmentos = entradas.slice(0, 8).map(([nombre, cant], idx) => {
        const len = (cant / total) * circ;
        const color = colores[idx % colores.length];
        const seg = `<circle cx="60" cy="60" r="${r}" fill="transparent" stroke="${color}" stroke-width="18" stroke-dasharray="${len.toFixed(2)} ${circ.toFixed(2)}" stroke-dashoffset="${(-offsetAcum).toFixed(2)}" transform="rotate(-90 60 60)" />`;
        offsetAcum += len;
        return { nombre, cant, color, pct: Math.round((cant / total) * 100), svg: seg };
      });

      return `
        <div class="p-4 rounded-2xl bg-[#231033] border border-[#3d1e57] space-y-3">
          <div class="flex items-center justify-between">
            <h4 class="text-sm font-extrabold text-[#C6FF00]">${titulo}</h4>
            <span class="text-xs text-[#C9B6D9] font-bold">Total: ${total}</span>
          </div>
          <div class="flex flex-col sm:flex-row items-center gap-4">
            <div class="relative w-32 h-32 shrink-0 flex items-center justify-center">
              <svg viewBox="0 0 120 120" class="w-full h-full">
                <circle cx="60" cy="60" r="${r}" fill="transparent" stroke="#311747" stroke-width="18" />
                ${segmentos.map(s => s.svg).join("")}
              </svg>
              <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                <span class="text-xl font-black text-white">${total}</span>
                <span class="text-[10px] text-[#C9B6D9] font-bold">REGISTROS</span>
              </div>
            </div>
            <div class="flex-1 w-full space-y-1.5">
              ${segmentos.map(s => `
                <div class="flex items-center justify-between gap-2 text-xs">
                  <div class="flex items-center gap-2 min-w-0">
                    <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${s.color}"></span>
                    <span class="text-white font-semibold truncate">${s.nombre}</span>
                  </div>
                  <span class="text-[#40C4FF] font-extrabold whitespace-nowrap">${s.cant} (${s.pct}%)</span>
                </div>
              `).join("")}
            </div>
          </div>
        </div>
      `;
    }

              ${state.mostrarFormOperador ? `

                    <input type="text" placeholder="${state.editandoOperadorId ? 'Nueva clave (opcional)' : 'Contraseña de acceso'}" value="${state.formOperador.password}" oninput="state.formOperador.password = this.value" class="px-3 py-2 rounded-xl bg-[#231033] border border-[#3d1e57] text-xs text-white" ${state.editandoOperadorId ? '' : 'required'} />
                    <input type="text" placeholder="Nombre completo" value="${state.formOperador.nombreCompleto}" oninput="state.formOperador.nombreCompleto = this.value" class="px-3 py-2 rounded-xl bg-[#231033] border border-[#3d1e57] text-xs text-white" required />
                    <input type="text" placeholder="Sede asignada" value="${state.formOperador.sede}" oninput="state.formOperador.sede = this.value" class="px-3 py-2 rounded-xl bg-[#231033] border border-[#3d1e57] text-xs text-white" required />

                      <div class="text-[11px] text-[#C9B6D9] break-words">Cargo: ${op.cargo}</div>
                    </div>
                    <div class="flex items-center gap-1.5">
                      <button onclick="state.editandoOperadorId = ${op.id}; state.formOperador = { username: '${op.username}', password: '', nombreCompleto: '${(op.nombre_completo || '').replace(/'/g, '')}', email: '${op.email || ''}', telefono: '${op.telefono || ''}', cargoRol: '${op.rol}', sede: '${(op.sede || '').replace(/'/g, '')}' }; state.mostrarFormOperador = true; render();" class="px-2.5 py-1 rounded-lg bg-[#311747] text-xs font-bold text-[#C6FF00]" title="Editar cargo">✏️ Editar</button>

                        op.activo === false
                          ? `<button onclick="cambiarEstadoOperador(${op.id}, '${op.username}', true)" class="px-2.5 py-1 rounded-lg bg-emerald-700 text-xs font-bold text-white">Reactivar</button>`
                          : `<button onclick="cambiarEstadoOperador(${op.id}, '${op.username}', false)" class="px-2.5 py-1 rounded-lg bg-[#5C1127] text-xs font-bold text-[#FFCDD2]">🗑️ Cesar</button>`

              </div>

          <div class="p-5 rounded-2xl bg-[#231033] border border-[#3d1e57] space-y-2">
            <h3 class="text-base font-extrabold text-[#40C4FF]">☁️ Arquitectura Híbrida Supabase + Cloudflare + Android KMP</h3>
            <p class="text-xs text-[#C9B6D9]">• Endpoint Supabase: <span class="mono text-[#C6FF00]">vktclzpkebwvfbrvtpxo.supabase.co</span></p>
            <p class="text-xs text-[#C9B6D9]">• Bucket Biométrico: <span class="mono text-[#C6FF00]">Supabase Storage / fotos-ciudadanos</span></p>
            <p class="text-xs text-[#C9B6D9]">• Plataforma Web: Cloudflare Pages Edge CDN</p>
            <p class="text-xs text-[#C9B6D9]">• App Móvil: Kotlin Multiplatform + Compose Multiplatform + SQLDelight Offline</p>
            <p class="text-xs text-[#C6FF00] font-bold">• Sincronización bidireccional en vivo entre tu celular y la web</p>
          </div>

          <button onclick="cerrarSesion()" class="w-full py-3.5 rounded-xl bg-[#FF5252] text-white font-extrabold text-sm shadow-lg">

      `;
    }

    function renderMainScaffold() {
      const s = state.sesion;
      const titulos = {
        inicio: "Centro de Comando & Monitoreo Operativo",
        padron: "Padrón Nacional PIDE (+81,997 Registros Ciudadanos)",
        tramites: "Ventanilla Única & Gestión de Trámites DNIe 3.0",

      };
      const navItems = [
        { id: "inicio", label: "Panel Ejecutivo", shortLabel: "Inicio", icon: ICONS.home, badge: "LIVE" },
        { id: "padron", label: "Padrón Nacional DNI", shortLabel: "Padrón", icon: ICONS.idCard, badge: (state.totalCiudadanos || 50009).toLocaleString() },
        { id: "tramites", label: "Ventanilla de Trámites", shortLabel: "Trámites", icon: ICONS.clipboard, badge: state.tramites.length },
        { id: "reportes", label: "Analítica y Auditoría", shortLabel: "Reportes", icon: ICONS.chart, badge: state.auditorias.length },
        { id: "perfil", label: "Seguridad & Operadores", shortLabel: "Perfil", icon: ICONS.shield, badge: "RBAC" }
      ];

      return `
        <!-- Franja Superior Gubernamental Gob.pe / RENIEC -->
        <div class="bg-[#08020E] border-b border-[#3d1e57]/70 px-4 lg:px-8 py-1.5 flex flex-wrap items-center justify-between gap-2 text-[11px] text-[#C9B6D9]">
          <div class="flex items-center gap-2.5">
            <span class="px-2 py-0.5 rounded bg-[#8C0B42] text-white font-black tracking-wider text-[10px]">PERÚ</span>
            <span class="font-semibold text-white/90">Registro Nacional de Identificación y Estado Civil • Plataforma de Interoperabilidad PIDE</span>
          </div>
          <div class="flex items-center gap-4">
            <span class="hidden md:inline text-[#C9B6D9]/80">Nodo Cloud: <b class="text-[#C6FF00] mono">vktclzpkebwvfbrvtpxo.supabase.co</b></span>
            <span class="flex items-center gap-1.5 font-bold ${state.supabaseConectado ? 'text-[#C6FF00]' : 'text-amber-300'}">
              <span class="w-2 h-2 rounded-full ${state.supabaseConectado ? 'bg-[#C6FF00] animate-pulse' : 'bg-amber-400'}"></span>
              ${state.supabaseConectado ? 'PostgreSQL Online' : 'Sincronizando...'}
            </span>
          </div>
        </div>

        <!-- Navbar Ejecutiva Superior -->
        <header class="topbar-gradient px-4 lg:px-8 py-3 flex items-center justify-between shadow-xl border-b border-white/10 sticky top-0 z-30">
          <div class="flex items-center gap-3.5">
            <div class="w-10 h-10 rounded-xl bg-[#160821]/70 border border-[#C6FF00]/70 flex items-center justify-center shadow text-[#C6FF00]">
              ${ICONS.idCard}
            </div>
            <div>
              <div class="flex items-center gap-2.5">
                <span class="font-black text-base sm:text-lg tracking-tight text-white">RENIEC DIGITAL</span>
                <span class="hidden md:inline-block px-2 py-0.5 rounded bg-black/35 border border-[#C6FF00]/40 text-[10px] font-extrabold text-[#C6FF00] mono">
                  v3.0 ENTERPRISE
                </span>
              </div>
              <div class="text-[11px] text-white/75 hidden sm:block font-medium">${titulos[state.tabActual]}</div>
            </div>
          </div>

          <!-- Acciones Rápidas y Credencial de Operador -->
          <div class="flex items-center gap-3">
            <button onclick="sincronizarConSupabase()" class="hidden sm:flex items-center gap-2 px-3.5 py-2 rounded-xl bg-black/30 hover:bg-black/50 border border-white/15 text-xs font-extrabold text-[#C6FF00] transition">
              ${ICONS.sync}
              <span>${state.sincronizando ? 'Sincronizando...' : 'Sincronizar BD'}</span>
            </button>

            <div class="hidden md:flex items-center gap-3 px-3.5 py-1.5 rounded-xl bg-black/30 border border-white/10">
              <div class="w-8 h-8 rounded-lg bg-[#C6FF00] text-[#14071E] font-black text-xs flex items-center justify-center shadow">
                ${(s.usuario || 'R').slice(0, 2).toUpperCase()}
              </div>
              <div class="leading-tight">
                <div class="text-xs font-extrabold text-white">${s.nombreCompleto.split('(')[0].trim()}</div>
                <div class="text-[10px] text-[#C6FF00] font-semibold truncate max-w-[190px]">@${s.usuario} • ${s.cargo}</div>
              </div>
            </div>

            <button onclick="cerrarSesion()" class="flex items-center gap-1.5 text-xs font-extrabold px-3.5 py-2 rounded-xl bg-[#160821]/85 hover:bg-[#160821] border border-[#C6FF00]/40 text-[#C6FF00] transition">
              ${ICONS.logout}
              <span>Salir</span>
            </button>
          </div>
        </header>

        <!-- Cuerpo Principal: Sidebar Lateral Ejecutiva + Área de Trabajo -->
        <div class="flex-1 flex flex-col lg:flex-row">
          <!-- Sidebar Lateral (Visible en Desktop lg+) -->
          <aside class="hidden lg:flex lg:w-64 xl:w-72 bg-[#12061C] border-r border-[#3d1e57]/70 flex-col justify-between p-5 shrink-0">
            <div class="space-y-6">
              <div>
                <div class="text-[10px] font-black uppercase tracking-widest text-[#C9B6D9]/70 px-3 mb-2.5">
                  Módulos del Sistema
                </div>
                <nav class="space-y-1.5">
                  ${navItems.map(item => {
                    const activo = state.tabActual === item.id;
                    return `
                      <button
                        onclick="state.tabActual = '${item.id}'; render();"
                        class="w-full flex items-center justify-between px-3.5 py-3 rounded-xl text-xs font-bold transition ${activo ? 'bg-[#C6FF00] text-[#14071E] font-extrabold shadow-lg' : 'text-[#D6C7E3] hover:bg-[#1F0D30] hover:text-white'}"
                      >
                        <span class="flex items-center gap-3">
                          ${item.icon}
                          <span>${item.label}</span>
                        </span>
                        <span class="px-2 py-0.5 rounded-md text-[10px] font-extrabold mono ${activo ? 'bg-[#14071E]/15 text-[#14071E]' : 'bg-[#231033] text-[#40C4FF] border border-[#3d1e57]'}">
                          ${item.badge}
                        </span>
                      </button>
                    `;
                  }).join('')}
                </nav>
              </div>

              <!-- Estado de Interoperabilidad Multiplataforma -->
              <div class="p-4 rounded-2xl glass-card space-y-2.5">
                <div class="flex items-center justify-between">
                  <span class="text-[11px] font-extrabold uppercase tracking-wider text-[#C6FF00]">Estado del Clúster</span>
                  <span class="px-2 py-0.5 rounded bg-emerald-950 border border-emerald-500/40 text-emerald-300 text-[10px] font-extrabold mono">ONLINE</span>
                </div>
                <p class="text-[11px] text-[#C9B6D9] leading-relaxed">
                  Sincronización bidireccional activa con PostgreSQL Cloud y terminales Android APK.
                </p>
                <div class="pt-2 text-[11px] text-white/90 font-semibold border-t border-white/10 flex items-center gap-1.5">
                  <span class="w-1.5 h-1.5 rounded-full bg-[#40C4FF]"></span>
                  <span class="truncate">${s.sede}</span>
                </div>
              </div>
            </div>

            <!-- Sello Institucional Inferior -->
            <div class="mt-6 p-3.5 rounded-2xl glass-card flex items-center gap-3">
              <img src="./mascota-reniec.png" alt="Mascota RENIEC" class="w-11 h-11 object-contain shrink-0 drop-shadow" />
              <div class="min-w-0">
                <div class="text-xs font-extrabold text-white truncate">RENIEC • UPeU</div>
                <div class="text-[10px] text-[#C6FF00] font-semibold truncate mono">Cloudflare Edge Network</div>
              </div>
            </div>
          </aside>

          <!-- Contenedor Principal de Vistas -->
          <div class="flex-1 flex flex-col min-w-0 bg-[#11061B] grid-pattern">
            <main class="flex-1 p-4 sm:p-6 lg:p-8 max-w-[1600px] w-full mx-auto">
              ${state.tabActual === "inicio" ? renderInicio() : ""}
              ${state.tabActual === "padron" ? renderPadron() : ""}
              ${state.tabActual === "tramites" ? renderTramites() : ""}
              ${state.tabActual === "reportes" ? renderReportes() : ""}
              ${state.tabActual === "perfil" ? renderPerfil() : ""}
            </main>

            <!-- Footer Corporativo -->
            <footer class="border-t border-[#3d1e57]/70 bg-[#0B0312] px-6 py-4 text-xs text-[#C9B6D9] flex flex-col sm:flex-row items-center justify-between gap-2">
              <div>
                <b class="text-white">Plataforma Nacional RENIEC Digital</b> • Sistema Integrado de Identificación y Estado Civil (DNIe 3.0)
              </div>
              <div class="flex items-center gap-3 text-[11px] mono">
                <span class="text-[#C6FF00] font-bold">Supabase PostgreSQL</span>
                <span>•</span>
                <span class="text-[#40C4FF] font-bold">Cloudflare Pages</span>
                <span>•</span>
                <span>Android KMP Sync</span>
              </div>
            </footer>
          </div>
        </div>

        <!-- Barra de Navegación Inferior (Móviles < lg) -->
        <nav class="lg:hidden bg-[#160821] border-t border-[#3d1e57] px-2 py-2 grid grid-cols-5 gap-1 sticky bottom-0 z-30">
          ${navItems.map(item => `
            <button
              onclick="state.tabActual = '${item.id}'; render();"
              class="flex flex-col items-center justify-center py-1.5 rounded-xl transition ${state.tabActual === item.id ? 'bg-[#C6FF00] text-[#14071E] font-extrabold' : 'text-[#C9B6D9] hover:text-white font-semibold'}"
            >
              ${item.icon}
              <span class="text-[10px] mt-1">${item.shortLabel}</span>
            </button>
          `).join('')}
        </nav>
      `;
    }

    let busquedaRemotaTimer = null;

    function actualizarBusquedaPadron(valor) {
      state.filtroTexto = valor;
      actualizarSoloResultadosPadron();
      clearTimeout(busquedaRemotaTimer);
      const q = (valor || "").trim();
      if (q.length >= 2) {
        busquedaRemotaTimer = setTimeout(async () => {
          try {
            const safe = encodeURIComponent(`*${q}*`);
            const url = `${SUPABASE_URL}/ciudadanos?or=(dni.ilike.${safe},nombres.ilike.${safe},apellido_paterno.ilike.${safe},apellido_materno.ilike.${safe},ubigeo.ilike.${safe})&limit=50`;
            const res = await fetch(url, { headers: SUPABASE_HEADERS });
            if (res.ok) {
              const data = await res.json();
              if (data.length > 0) {
                const nuevos = data.map(c => ({
                  id: c.id,
                  dni: c.dni,
                  nombres: c.nombres,
                  apellidoPaterno: c.apellido_paterno,
                  apellidoMaterno: c.apellido_materno,
                  fechaNacimiento: c.fecha_nacimiento,
                  estadoCivil: c.estado_civil,
                  ubigeo: c.ubigeo,
                  direccion: c.direccion,
                  donacionOrganos: c.donacion_organos
                }));
                const mapa = new Map();
                [...nuevos, ...state.ciudadanos].forEach(item => mapa.set(item.id, item));
                state.ciudadanos = Array.from(mapa.values());
                actualizarSoloResultadosPadron();
              }
            }
          } catch (_) {}
        }, 280);
      }
    }

    function render() {
      const root = document.getElementById("app-root");
      const activeEl = document.activeElement;
      const activeId = activeEl && activeEl.id ? activeEl.id : null;
      const activePlaceholder = activeEl && activeEl.getAttribute ? activeEl.getAttribute("placeholder") : null;
      const selStart = activeEl && typeof activeEl.selectionStart === "number" ? activeEl.selectionStart : null;
      const selEnd = activeEl && typeof activeEl.selectionEnd === "number" ? activeEl.selectionEnd : null;

      root.innerHTML = state.sesion ? renderMainScaffold() : renderLogin();

      let target = null;
      if (activeId) {
        target = document.getElementById(activeId);
      } else if (activePlaceholder) {
        target = root.querySelector(`input[placeholder="${activePlaceholder.replace(/"/g, '\\"')}"]`);
      }
      if (target) {
        target.focus();
        try {
          if (selStart !== null && selEnd !== null && typeof target.setSelectionRange === "function") {
            target.setSelectionRange(selStart, selEnd);
          }
        } catch (_) {}
      }
    }

    if (window.location.hash.includes("access_token=")) {
      state.sesion = {
        ...USUARIOS_RBAC.dolton,
        nombreCompleto: "Brigadista Dolton Tom Meza (Acceso Verificado por Correo)"
      };
      guardarStorage();
      window.history.replaceState({}, document.title, window.location.pathname);
    } else if (state.sesion && state.sesion.usuario && USUARIOS_RBAC[state.sesion.usuario]) {
      state.sesion = { ...USUARIOS_RBAC[state.sesion.usuario] };
      guardarStorage();
    }

    render();
    sincronizarConSupabase();
  </script>
</body>
