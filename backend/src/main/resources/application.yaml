server:
  port: 8080
spring:
  application:
    name: ReniecBackend
  datasource:
    url: jdbc:h2:mem:reniecdb;DB_CLOSE_DELAY=-1
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    enabled: true

